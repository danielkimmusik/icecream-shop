<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Icecream Shop!</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #game-container { position: relative; width: 800px; height: 600px; background-color: #333; overflow: hidden; }

        #mute-btn { position: absolute; right: 15px; bottom: 15px; width: 50px; height: 50px; z-index: 110; cursor: pointer; opacity: 0.5; transition: opacity 0.2s; image-rendering: pixelated; }
        #mute-btn:hover { opacity: 0.9; }

        /* [수정] 이전보다 15% 더 빨라진 4.16s 속도 적용 */
        @keyframes pingPong {
            0% { left: 0px; }
            100% { left: calc(800px - 640px); } 
        }
        
        .move-pingpong-left { animation: pingPong 4.16s linear infinite alternate !important; }
        .move-pingpong-right { animation: pingPong 4.16s linear infinite alternate-reverse !important; }

        @keyframes sharpShake { 
            0%, 100% { transform: translate(0, 0); } 25% { transform: translate(-20px, 0); } 50% { transform: translate(20px, 0); } 75% { transform: translate(-20px, 0); }
        }
        .shake-effect { animation: sharpShake 0.1s linear !important; }

        @keyframes superSpin {
            0% { bottom: -110px; transform: translateX(-50%) rotate(0deg) scale(1); }
            50% { bottom: 180px; transform: translateX(-50%) rotate(900deg) scale(1.4); }
            100% { bottom: -700px; transform: translateX(-50%) rotate(1800deg) scale(0.5); opacity: 0; }
        }
        .super-spin { animation: superSpin 1.5s ease-in-out forwards !important; }

        #transition-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #a3d5ff url('background.png') no-repeat center center; background-size: cover; image-rendering: pixelated; z-index: 90; display: none; }
        #start-img-obj { position: absolute; left: 50%; transform: translateX(-50%); width: 700px; image-rendering: pixelated; bottom: -400px; z-index: 95; }
        #game-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #a3d5ff url('background.png') no-repeat center center; background-size: cover; image-rendering: pixelated; z-index: 1; display: none; }
        #customer-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; }
        .customer { position: absolute; bottom: -700px; left: 50%; transform: translateX(-50%); width: 585px; height: auto; image-rendering: pixelated; transition: bottom 1.5s ease-out; z-index: 6; }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 65; opacity: 0; transition: opacity 0.5s; pointer-events: none; }
        
        #button-panel { position: absolute; top: 55%; display: flex; gap: 20px; z-index: 70; opacity: 0; visibility: hidden; width: fit-content; }
        .make-btn { width: 110px; height: 110px; background: white; border: 4px solid #5a3e2b; border-radius: 20px; cursor: pointer; display: flex; justify-content: center; align-items: center; box-shadow: 0 8px 0 #5a3e2b; }
        .make-btn img { width: 100px; height: 100px; image-rendering: pixelated; }
        
        .speech-bubble { position: absolute; bottom: 260px; left: 400px; background: white; border: 4px solid #5a3e2b; border-radius: 30px; padding: 15px; z-index: 20; opacity: 0; transition: opacity 0.5s; display: flex; flex-direction: column; align-items: center; min-width: 180px; }
        #score-panel { position: absolute; top: 20px; right: 20px; background: #fdf5e6; border: 3px solid #5a3e2b; padding: 5px 15px; z-index: 50; font-family: 'Courier New'; font-weight: bold; }
    </style>
</head>
<body>

<div id="game-container">
    <img src="mute.png" id="mute-btn" onclick="toggleMute()">
    <div id="intro-screen" onclick="startSequence()" style="position:absolute; width:100%; height:100%; background:#000; z-index:100; display:flex; justify-content:center; align-items:center; cursor:pointer;">
        <img src="logo.png" style="width:600px; image-rendering:pixelated;">
    </div>
    <div id="transition-layer"><img src="start.png" id="start-img-obj"></div>
    <div id="game-screen"></div>
    <div id="customer-layer"></div>
    <div id="overlay"></div>
    <div id="speech-bubble" class="speech-bubble">
        <img id="order-icon" style="width:275px; height:auto; image-rendering:pixelated;" src="">
        <span id="order-text" style="font-size:24px; color:#5a3e2b; margin-top:8px;"></span>
    </div>
    <div id="button-panel"></div>
    <div id="score-panel">COINS: <span id="coin-count">0</span></div>
</div>

<script>
    const sndClick = new Audio('click.wav');
    const sndYay = new Audio('yay.wav');
    const sndKaching = new Audio('kaching.wav');
    const sndWrong = new Audio('wrong answer.wav');
    const bgm = new Audio('Scoops and Smiles.mp3');
    bgm.loop = true; bgm.volume = 0.4;

    const customerList = ['customer_alien.png', 'customer_boy.png', 'customer_girl.png', 'customer_pingo.png', 'customer_puppy.png'];
    const icecreamMenu = [
        { id: 'choco', name: 'CHOCO', img: 'icecream_choco.png' },
        { id: 'pistachio', name: 'PISTACHIO', img: 'icecream_pistachio.png' },
        { id: 'strawberry', name: 'STRAWBERRY', img: 'icecream_strawberry.png' },
        { id: 'vanilla', name: 'VANILLA', img: 'icecream_vanilla.png' },
        { id: 'banana', name: 'BANANA', img: 'icecream_banana.png' }
    ];

    let currentOrder = null;
    let score = 0;
    let isMuted = false;

    function toggleMute() {
        isMuted = !isMuted;
        bgm.muted = isMuted;
        document.getElementById('mute-btn').src = isMuted ? 'unmute.png' : 'mute.png';
    }

    function startSequence() {
        bgm.play().catch(e => {});
        sndClick.play();
        document.getElementById('intro-screen').style.display = 'none';
        const transLayer = document.getElementById('transition-layer');
        transLayer.style.display = 'block';
        document.getElementById('start-img-obj').classList.add('sweep-animation');
        setTimeout(() => {
            transLayer.style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            initButtons();
            spawnCustomer();
        }, 1800);
    }

    function initButtons() {
        const panel = document.getElementById('button-panel');
        panel.innerHTML = '';
        icecreamMenu.forEach(item => {
            const btn = document.createElement('div');
            btn.className = 'make-btn';
            btn.innerHTML = `<img src="${item.img}">`;
            btn.onclick = (e) => { e.stopPropagation(); checkOrder(item.id); };
            panel.appendChild(btn);
        });
    }

    function spawnCustomer() {
        const layer = document.getElementById('customer-layer');
        const bubble = document.getElementById('speech-bubble');
        const overlay = document.getElementById('overlay');
        const panel = document.getElementById('button-panel');

        layer.innerHTML = '';
        bubble.style.opacity = '0';
        overlay.style.opacity = '0';
        panel.style.visibility = 'hidden';
        panel.style.opacity = '0';
        panel.classList.remove('move-pingpong-left', 'move-pingpong-right');

        const img = new Image();
        img.src = customerList[Math.floor(Math.random() * customerList.length)];
        img.className = 'customer';
        layer.appendChild(img);

        currentOrder = icecreamMenu[Math.floor(Math.random() * icecreamMenu.length)];
        document.getElementById('order-icon').src = currentOrder.img;
        document.getElementById('order-text').innerText = currentOrder.name + "!";

        setTimeout(() => { img.style.bottom = '-110px'; }, 100);
        setTimeout(() => { bubble.style.opacity = '1'; }, 1600);
        setTimeout(() => {
            overlay.style.opacity = '1'; 
            panel.style.visibility = 'visible';
            panel.style.opacity = '1';
            const startDir = Math.random() < 0.5 ? 'move-pingpong-left' : 'move-pingpong-right';
            panel.classList.add(startDir);
        }, 3600);
    }

    function checkOrder(id) {
        const container = document.getElementById('game-container');
        const panel = document.getElementById('button-panel');
        const customer = document.querySelector('.customer');

        if (id === currentOrder.id) {
            sndClick.currentTime = 0; sndClick.play();
            score += 10;
            document.getElementById('coin-count').innerText = score;
            document.getElementById('overlay').style.opacity = '0';
            panel.style.opacity = '0';
            panel.style.visibility = 'hidden';
            panel.classList.remove('move-pingpong-left', 'move-pingpong-right');
            document.getElementById('speech-bubble').style.opacity = '0';
            sndYay.play(); sndKaching.play(); 

            if (customer) {
                customer.style.transition = 'none';
                customer.classList.add('super-spin');
            }
            setTimeout(spawnCustomer, 1600);
        } else {
            sndWrong.currentTime = 0; sndWrong.play();
            container.classList.remove('shake-effect');
            void container.offsetWidth; 
            container.classList.add('shake-effect');
        }
    }
</script>
</body>
</html>
